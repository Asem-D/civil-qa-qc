# ──────────────────────────────────────────────────────────────────────────────
# Civil QC — Default Rule Configuration
#
# This file defines which QA/QC checks run and at what severity.
# Set 'enabled: false' to skip a rule entirely.
# Edit parameters to match your organisation's standards.
#
# Rule IDs map to implementation classes via the CheckType field.
# The plugin discovers rule classes by scanning loaded assemblies.
# ──────────────────────────────────────────────────────────────────────────────

rules:

  # ─── Performance Checks ────────────────────────────────────────────────────
  - id: PERF-001
    name: File size
    check_type: FileSize
    severity: Info
    description: Reports drawing file size and warns when it exceeds thresholds.
    parameters:
      warning_mb: 100
      error_mb: 500

  # ─── Layer Checks ──────────────────────────────────────────────────────────

  # LAYER-001: Naming convention
  # Validates that layer names start with an allowed prefix followed by '-'.
  # Edit the allowed_prefixes list to match your project's layer standard.
  - id: LAYER-001
    name: Layer naming convention
    check_type: LayerNaming
    severity: Warning
    description: >-
      Checks every user-created layer against a list of allowed name prefixes.
      System layers "0" and "Defpoints" are always skipped.
    parameters:
      allowed_prefixes:
        - CIVIL
        - SURF
        - ROAD
        - PIPE
        - ALGN
        - CORR
        - SITE
        - UTIL
        - DEM
        - HYD
        - ELEC
        - STR
        - ARCH
        - TOPO
        - BNDY
        - ANNO
        - DIM
        - TEXT
        - SYMB
        - VIEWS
        - DEF
        - EXIST
        - PROJ
        - TEMP
        - UTILITIES
      require_prefix: true
      separator: "-"

  # LAYER-002: Empty layers
  # Finds layers with zero drawn entities in ModelSpace or PaperSpace.
  - id: LAYER-002
    name: Empty layers
    check_type: EmptyLayers
    severity: Info
    description: >-
      Identifies layers that exist in the layer table but have no entities
      drawn on them. Empty layers are usually leftover from deleted content
      or template imports.
    parameters:
      exclude_defaults: true    # skip "0" and "Defpoints"

  # LAYER-003: Frozen/off empty layers
  # Layers that are both disabled (frozen or off) and empty are dead weight.
  - id: LAYER-003
    name: Unused layers
    check_type: UnusedLayers
    severity: Info
    description: >-
      Finds layers that are frozen or turned off AND have zero entities.
      These layers serve no purpose and can be safely purged.
    parameters:
      exclude_defaults: true

  # ─── Drawing Checks ────────────────────────────────────────────────────────

  # DRAW-001: Drawing units
  # Reports INSUNITS and optionally enforces a specific unit system.
  - id: DRAW-001
    name: Drawing units
    check_type: DrawingUnits
    severity: Warning
    description: >-
      Reads the INSUNITS system variable and compares against the expected
      value. Mismatched units are a top source of scale errors.
    parameters:
      expected: "Meters"        # change to match your project standard

  # DRAW-002: External references
  # Reports xref status: resolved, unloaded, or missing.
  - id: DRAW-002
    name: Xref status
    check_type: XrefStatus
    severity: Warning
    description: >-
      Scans all external references and reports their resolution status.
      Missing xrefs indicate broken file paths or moved reference files.
    parameters:
      fail_on_missing: true
      warn_on_overlay: false

  # DRAW-003: Proxy objects
  # Counts proxy entities (placeholders for unsupported third-party objects).
  - id: DRAW-003
    name: Proxy objects
    check_type: ProxyObjects
    severity: Warning
    description: >-
      Counts proxy entities created by third-party applications. Proxy
      objects indicate missing modules or version mismatches and cannot
      be edited until the source application is available.
    parameters:
      max_count: 0              # 0 = report only, never fail

  # ─── Annotation Checks ───────────────────────────────────────────────────

  # ANNO-001: Annotation scale consistency
  # Detects annotative entities and checks their distribution.
  - id: ANNO-001
    name: Annotation scale consistency
    check_type: AnnotationScale
    severity: Info
    description: >-
      Detects annotative entities via the ACAD_ANNO XData marker and reports
      their count, type distribution, and location (ModelSpace vs PaperSpace).
      Optionally flags annotative objects in ModelSpace, which is usually wrong.
    parameters:
      fail_if_annotative_in_modelspace: false

  # ANNO-002: Text style standards
  # Validates text styles against a configurable allowed list.
  - id: ANNO-002
    name: Text style standards
    check_type: TextStyle
    severity: Warning
    description: >-
      Checks that all text styles in the drawing are on the allowed list.
      Non-standard styles indicate copy/paste from other projects or
      uncontrolled template imports.
    parameters:
      allowed_styles:
        - Standard
        - Arial
      check_fonts: false
      allowed_fonts: []

  # ─── Block Checks ────────────────────────────────────────────────────────

  # BLOCK-001: Block naming conventions
  # Checks block names against prefix/suffix rules.
  - id: BLOCK-001
    name: Block naming conventions
    check_type: BlockNaming
    severity: Warning
    description: >-
      Validates block names against allowed and forbidden prefix lists.
      Catches anonymous blocks ("A$XXXX"), broken dynamic blocks ("*Unnn"),
      and non-standard naming.
    parameters:
      allowed_prefixes: []
      forbidden_prefixes:
        - "A$"
        - "*U"
        - "*D"
        - "*X"
      require_prefix: false
      max_name_length: 0

  # BLOCK-002: Dynamic block validation
  # Checks that dynamic blocks have intact definitions.
  - id: BLOCK-002
    name: Dynamic block validation
    check_type: DynamicBlock
    severity: Warning
    description: >-
      Validates dynamic blocks by checking that their definitions are intact.
      Blocks with IsDynamicBlock=true but empty definitions have lost their
      dynamic behaviour, usually from copy/paste across drawings.
    parameters:
      fail_on_broken: true

  # ─── Drawing Health Checks ───────────────────────────────────────────────

  # DWG-001: Drawing recovery status
  # Detects whether the drawing has been recovered or repaired.
  - id: DWG-001
    name: Drawing recovery status
    check_type: DrawingRecovery
    severity: Info
    description: >-
      Checks for recovery indicators: AUDITCTL flag, proxy graphics,
      and proxy entities. Recovered drawings may contain data loss or
      incomplete geometry.
    parameters:
      fail_on_recovery: false
